<!-- base href = the document's own folder, so relative images resolve. -->
<base href="@@MDBOSS_BASE_HREF@@">
<!-- Bundled, absolute file:// URLs: unaffected by <base>. Offline only. -->

<style>
  html, body { margin: 0; background: #ffffff; }
  .markdown-body {
    box-sizing: border-box;
    min-width: 200px;
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 40px 96px;
  }
  pre.mermaid { background: transparent; text-align: center; }
  /* LaTeX math (KaTeX). Display math scrolls horizontally if wide. */
  .math-display { margin: 1em 0; overflow-x: auto; overflow-y: hidden; }
  .katex-display { margin: 0 }
  /* MkDocs / Material admonitions and collapsible (?) blocks. */
  .admonition {
    --admon: #9e9e9e;
    margin: 1em 0; padding: .6rem .9rem;
    border: 1px solid #d0d7de;
    border-left: .3rem solid var(--admon);
    border-radius: 6px; background: #fff;
  }
  .admonition > :first-child { margin-top: 0 }
  .admonition > :last-child { margin-bottom: 0 }
  .admonition > .admonition-title {
    display: flex; align-items: center; gap: .5rem;
    margin: -.6rem -.9rem .6rem; padding: .4rem .9rem;
    font-weight: 700; color: #1f2328;
    background: color-mix(in srgb, var(--admon) 12%, #fff);
    border-bottom: 1px solid color-mix(in srgb, var(--admon) 30%, #fff);
  }
  .admonition > .admonition-title svg {
    width: 1.05em; height: 1.05em; flex-shrink: 0; fill: var(--admon);
  }
  summary.admonition-title { cursor: pointer; list-style: none }
  summary.admonition-title::-webkit-details-marker { display: none }
  .admonition.note { --admon: #448aff } .admonition.abstract { --admon: #00b0ff }
  .admonition.info { --admon: #00b8d4 } .admonition.tip { --admon: #00bfa5 }
  .admonition.success { --admon: #00c853 } .admonition.question { --admon: #64dd17 }
  .admonition.warning { --admon: #ff9100 } .admonition.failure { --admon: #ff5252 }
  .admonition.danger { --admon: #ff1744 } .admonition.bug { --admon: #f50057 }
  .admonition.example { --admon: #7c4dff } .admonition.quote { --admon: #9e9e9e }
  /* GitHub alert title: space the octicon from the label. */
  .markdown-alert-title { margin-bottom: 4px; }
  .markdown-alert-title svg {
    margin-right: 8px;
    fill: currentColor;
    flex-shrink: 0;
  }
  /* Pygments blocks sit inside the GitHub code-block chrome. */
  .highlight pre {
    padding: 16px;
    overflow: auto;
    font-size: 85%;
    line-height: 1.45;
    background-color: #f6f8fa;
    border-radius: 6px;
  }
  .highlight { margin-bottom: 16px; }
</style>
</head>
<body>
<article class="markdown-body">
@@MDBOSS_BODY@@
</article>

    function addIcons() {
      var titles = document.querySelectorAll(".markdown-alert-title");
      for (var i = 0; i < titles.length; i++) {
        var title = titles[i];
        if (title.querySelector("svg")) { continue; }
        var cls = title.parentElement ? title.parentElement.className : "";
        var m = cls.match(
          /markdown-alert-(note|tip|important|warning|caution)/
        );
        if (m && ICONS[m[1]]) {
          title.insertAdjacentHTML("afterbegin", ICONS[m[1]]);
        }
      }
    }
    document.addEventListener("DOMContentLoaded", addIcons);
    addIcons();
  })();

<!-- Web channel: report preview scrolling back to Qt (bidirectional sync).
     Loads from Qt's built-in qrc resource; no-ops when no channel is set
     (e.g. the Help window). -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  (function () {
    if (!(window.QWebChannel && window.qt && qt.webChannelTransport)) {
      return;
    }
    new QWebChannel(qt.webChannelTransport, function (channel) {
      var bridge = channel.objects.mdbossBridge;
      if (!bridge || !bridge.previewScrolled) { return; }
      var ticking = false;
      window.addEventListener("scroll", function () {
        if (ticking) { return; }
        ticking = true;
        window.requestAnimationFrame(function () {
          ticking = false;
          var h = document.documentElement;
          var max = h.scrollHeight - h.clientHeight;
          bridge.previewScrolled(max > 0 ? window.scrollY / max : 0);
        });
      }, { passive: true });
    });
  })();
</script>

<script src="@@MDBOSS_KATEX_JS@@"></script>
<script>
  // Render inline/display LaTeX with the bundled KaTeX (offline).
  (function () {
    if (!window.katex) { return; }
    function renderMath() {
      var nodes = document.querySelectorAll(".math-inline, .math-display");
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (el.dataset.mdbossRendered) { continue; }
        try {
          window.katex.render(el.textContent, el, {
            displayMode: el.classList.contains("math-display"),
            throwOnError: false
          });
          el.dataset.mdbossRendered = "1";
        } catch (e) { /* leave the raw source on failure */ }
      }
    }
    document.addEventListener("DOMContentLoaded", renderMath);
    renderMath();
  })();
</script>
